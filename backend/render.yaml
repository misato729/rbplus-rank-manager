services:
  - type: web
    name: score-manager-backend
    env: docker
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://score-manager-backend.onrender.com/
